name = "telegram-harness-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# Secrets, set by name outside this file:
#   wrangler secret put API_KEY
#   wrangler secret put INTAKE_API_KEY
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put TELEGRAM_BOT_TOKEN_MAIN
# This file does not deploy. Do not put token values here.

[vars]
TELEGRAM_ALLOW_NETWORK = "false"

[[d1_databases]]
binding = "DB"
database_name = "telegram-harness"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "../../packages/db/migrations"

[triggers]
crons = ["*/5 * * * *"]
