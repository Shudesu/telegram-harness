name = "telegram-harness-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true

# Secrets, set by name outside this file:
#   wrangler secret put API_KEY
#   wrangler secret put INTAKE_API_KEY
#   wrangler secret put TELEGRAM_WEBHOOK_SECRET
#   wrangler secret put TELEGRAM_BOT_TOKEN_MAIN
#   wrangler secret put TELEGRAM_API_ID
#   wrangler secret put TELEGRAM_API_HASH
#   wrangler secret put TELEGRAM_SESSION_ENCRYPTION_KEY
#   wrangler secret put TELEGRAM_USER_SESSION
# This file does not deploy. Do not put token values, api hashes, or session strings here.
# MTProto does not run on the Worker by default. Keep TELEGRAM_USER_ALLOW_NETWORK false.

[vars]
TELEGRAM_ALLOW_NETWORK = "false"
TELEGRAM_USER_ALLOW_NETWORK = "false"

[[d1_databases]]
binding = "DB"
database_name = "telegram-harness"
database_id = "YOUR_D1_DATABASE_ID"
migrations_dir = "../../packages/db/migrations"

[triggers]
crons = ["*/5 * * * *"]
